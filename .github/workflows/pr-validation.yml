name: PR validation

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd FrontEnd && npm ci
      - run: cd FrontEnd && npm run build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd Backend && npm ci
      - run: cd Backend && npm test
